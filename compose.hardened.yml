# Opt-in override, NOT the default. Runtime compatibility is still unverified.
# docker compose -f compose.yml -f compose.hardened.yml config
services:
  dsh:
    read_only: true
    environment:
      # Load native addons from the immutable image, not the noexec tmpfs.
      NARB_DISABLE_NATIVE_CACHE: "1"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
