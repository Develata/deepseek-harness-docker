name: Build and smoke-test DSH image
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested AMD64 image as a fixed commit tag and latest
        type: boolean
        default: false
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check wrapper contracts without Docker
        run: |
          node --test tests/prepare-homes.test.mjs tests/runtime-checks.test.mjs tests/dsh-session-smoke.test.mjs
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build AMD64 image
        run: docker build --platform linux/amd64 -t dsh-tested:local .
      - name: Smoke-test toolchains, bind persistence and real DSH sessions
        run: python3 scripts/toolchain-smoke.py dsh-tested:local
      - name: Repeat under optional read-only rootfs plus tmpfs
        run: python3 scripts/toolchain-smoke.py dsh-tested:local --hardened
      - name: Start isolated native Web UI
        run: >-
          docker run -d --name dsh-smoke --init
          --cap-drop ALL --security-opt no-new-privileges
          -p 127.0.0.1:3080:3080 dsh-tested:local
      - name: Smoke-test native authentication without model calls
        run: python3 scripts/smoke.py
      - name: Remove disposable container and runtime volumes
        if: always()
        run: docker rm -fv dsh-smoke 2>/dev/null || true
      - name: Export tested image, not runtime data
        run: docker save dsh-tested:local | gzip > dsh-amd64.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-amd64-image
          path: dsh-amd64.tar.gz
          retention-days: 1
          if-no-files-found: error
  publish:
    # Publish only an explicitly requested run on the repository's default branch.
    if: inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dsh-amd64-image
      - name: Load the tested image
        run: gzip -dc dsh-amd64.tar.gz | docker load
      - name: Publish fixed tag and latest for the same tested image
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repository="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image="$repository:0.2.1-rc.2-${GITHUB_SHA}"
          latest="$repository:latest"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          # Both tags reference the exact image loaded from the successful build
          # artifact. Never rebuild in this job or alias a historical digest.
          docker tag dsh-tested:local "$image"
          docker push "$image"
          fixed_digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')"
          docker tag dsh-tested:local "$latest"
          docker push "$latest"
          latest_digest="$(docker buildx imagetools inspect "$latest" --format '{{json .Manifest}}' | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')"
          test "$fixed_digest" = "$latest_digest"
          printf 'Published tested AMD64 image: %s\nLatest: %s\nVerified identical digest: %s\n' "$image" "$latest" "$fixed_digest" >> "$GITHUB_STEP_SUMMARY"
